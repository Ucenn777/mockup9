<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Customer</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            padding: 15px;
        }

        /* Navbar Responsif */
        .navbar {
            background-color: #ffffff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .btn-logout {
            background-color: #dc3545;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-logout:hover {
            background-color: #bd2130;
        }

        /* Layout Utama: Grid & Flexbook agar Responsif */
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Media Query untuk Layar Desktop (Desktop First / Responsive Layout) */
        @media (min-width: 768px) {
            .container {
                flex-direction: row;
            }
        }

        .catalog {
            flex: 3;
        }

        .cart {
            flex: 1;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            height: fit-content;
        }

        /* Responsive Grid untuk Kartu Produk */
        .grid-produk {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .card {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        /* Fitur Rating & Jumlah Pembelian */
        .info-produk {
            font-size: 13px;
            color: #555;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rating {
            color: #ffc107;
            font-weight: bold;
        }

        .terjual {
            color: #6c757d;
        }

        .harga {
            color: #28a745;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
        }

        /* Styling Tombol dengan Link Page */
        .btn {
            display: block;
            text-align: center;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-beli {
            background-color: #007bff;
            color: white;
        }

        .btn-beli:hover {
            background-color: #0056b3;
        }

        .btn-checkout {
            background-color: #28a745;
            color: white;
            margin-top: 15px;
        }

        .btn-checkout:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h2>Halo, Customer! 👋</h2>
        <a href="index.html" class="btn-logout">Logout</a>
    </div>

    <div class="container">
        
        <div class="catalog">
            <h3 style="margin-bottom: 15px;">Daftar Produk</h3>
            <div class="grid-produk">

                <div class="card">
                    <div>
                        <h3>Kopi Hitam</h3>
                        <div class="info-produk">
                            <span class="rating">★ 4.8</span>
                            <span class="terjual">Terjual 150+</span>
                        </div>
                        <p class="harga">Rp 15.000</p>
                    </div>
                    <a href="detail-produk.html?id=1" class="btn btn-beli">Beli Sekarang</a>
                </div>

                <div class="card">
                    <div>
                        <h3>Es Teh Manis</h3>
                        <div class="info-produk">
                            <span class="rating">★ 4.9</span>
                            <span class="terjual">Terjual 500+</span>
                        </div>
                        <p class="harga">Rp 5.000</p>
                    </div>
                    <a href="detail-produk.html?id=2" class="btn btn-beli">Beli Sekarang</a>
                </div>

                <div class="card">
                    <div>
                        <h3>Roti Bakar</h3>
                        <div class="info-produk">
                            <span class="rating">★ 4.7</span>
                            <span class="terjual">Terjual 80+</span>
                        </div>
                        <p class="harga">Rp 12.000</p>
                    </div>
                    <a href="detail-produk.html?id=3" class="btn btn-beli">Beli Sekarang</a>
                </div>

            </div>
        </div>

        <div class="cart">
            <h3>Keranjang Saya</h3>
            <hr style="margin: 10px 0; border: 0.5px solid #eee;">
            
            <p style="font-size: 14px;">1x Kopi Hitam - Rp 15.000</p>
            
            <hr style="margin: 10px 0; border: 0.5px solid #eee;">
            <p><strong>Total: Rp 15.000</strong></p>
            
            <a href="checkout.html" class="btn btn-checkout">Proses Checkout</a>
        </div>

    </div>

</body>
</html>
