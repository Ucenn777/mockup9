<!DOCTYPE html>
<html>
<head>

<title>Customer Toko</title>

<style>

body{
    font-family:Arial;
    margin:0;
    background:#f2f2f2;
}

header{
    background:#007bff;
    color:white;
    padding:15px;
    text-align:center;
}

.container{
    padding:20px;
}

.card{
    background:white;
    padding:15px;
    margin:10px;
    border-radius:12px;
    display:inline-block;
    width:220px;
    vertical-align:top;
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
}

button{
    background:#007bff;
    color:white;
    border:0;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
}

.cart{
    position:fixed;
    right:20px;
    bottom:20px;
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 0 10px #aaa;
}

</style>

</head>


<body>


<header>

<h1>Toko Online</h1>

<p>Halaman Customer</p>

</header>



<div class="container" id="produk">

</div>




<div class="cart">

<h3>Keranjang</h3>

<p id="jumlahCart">
0 Barang
</p>


<button onclick="lihatCart()">
Lihat Keranjang
</button>

</div>



<script>


let barang=[];

let keranjang=[];



// ambil barang dari admin

function loadBarang(){

let data=localStorage.getItem("barang");


if(data){

barang=JSON.parse(data);

}


tampilProduk();

}




function tampilProduk(){


let html="";


barang.forEach(function(b,i){


html+=`

<div class="card">

<img src="${b.foto}">

<h3>${b.nama}</h3>

<p>Rp ${b.harga}</p>


<button onclick="tambah(${i})">
Tambah Keranjang
</button>


</div>

`;


});


document.getElementById("produk").innerHTML=html;


}




function tambah(i){


keranjang.push(barang[i]);


document.getElementById("jumlahCart").innerHTML=
keranjang.length+" Barang";


alert("Masuk keranjang");


}




function lihatCart(){


if(keranjang.length==0){

alert("Keranjang kosong");

return;

}


let isi="";


keranjang.forEach(function(k){

isi+=k.nama+" - Rp "+k.harga+"\n";

});


alert(isi);


}




loadBarang();


</script>


</body>
</html>
