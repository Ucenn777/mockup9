<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokoKu - Toko Online</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f8; color: #333; }

        header { background: #ee4d2d; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; position: sticky; top: 0; z-index: 100; }

        .container { max-width: 800px; margin: 15px auto; padding: 0 10px; }

        /* Product Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.08); cursor: pointer; transition: 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .card-img { width: 100%; height: 160px; object-fit: cover; background: #eee; }
        .card-body { padding: 10px; }
        .card-title { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #222; }
        .card-price { color: #ee4d2d; font-weight: bold; font-size: 14px; }

        /* Modal Product Detail */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 10px; }
        .modal-content { background: #fff; border-radius: 10px; max-width: 450px; width: 100%; overflow: hidden; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; font-weight: bold; color: #333; cursor: pointer; z-index: 10; background: #fff; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        /* Gallery Slider */
        .slider-box { position: relative; width: 100%; height: 300px; background: #000; overflow: hidden; }
        .slider-box img { width: 100%; height: 100%; object-fit: contain; }
        .arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: #fff; border: none; font-size: 18px; padding: 10px 12px; cursor: pointer; border-radius: 4px; }
        .arrow.left { left: 10px; }
        .arrow.right { right: 10px; }

        .thumbs { display: flex; gap: 6px; padding: 10px; overflow-x: auto; background: #fff; }
        .thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; border: 2px solid #ddd; cursor: pointer; opacity: 0.6; flex-shrink: 0; }
        .thumb.active { border-color: #ee4d2d; opacity: 1; }

        .detail-body { padding: 15px; }
        .detail-price { font-size: 20px; color: #ee4d2d; font-weight: bold; margin-bottom: 8px; }
        .btn-buy { width: 100%; background: #ee4d2d; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <header>🛍️ TokoKu</header>

    <div class="container">
        <div class="grid" id="product-list"></div>
    </div>

    <div class="modal" id="detailModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="slider-box">
                <button class="arrow left" onclick="changeSlide(-1)">❮</button>
                <img id="main-slide-img" src="">
                <button class="arrow right" onclick="changeSlide(1)">❯</button>
            </div>
            <div class="thumbs" id="thumbs-box"></div>
            <div class="detail-body">
                <h3 id="p-title">Nama Produk</h3>
                <div class="detail-price" id="p-price">Rp 0</div>
                <p style="font-size: 12px; color: #666;" id="p-stock">Stok: 0</p>
                <button class="btn-buy" onclick="alert('Pesanan berhasil dibuat!')">Beli Sekarang</button>
            </div>
        </div>
    </div>

    <script>
        let currentImages = [];
        let currentIndex = 0;

        function loadProducts() {
            const products = JSON.parse(localStorage.getItem('toko_products')) || [];
            const listContainer = document.getElementById('product-list');
            listContainer.innerHTML = '';

            if (products.length === 0) {
                listContainer.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding: 30px; color: #888;">Belum ada produk yang dijual.</p>`;
                return;
            }

            products.forEach(p => {
                const mainImg = (p.images && p.images.length > 0) ? p.images[0] : p.img;
                listContainer.innerHTML += `
                    <div class="card" onclick="openDetail(${p.id})">
                        <img src="${mainImg}" class="card-img" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&q=80'">
                        <div class="card-body">
                            <div class="card-title">${p.name}</div>
                            <div class="card-price">Rp ${p.price.toLocaleString('id-ID')}</div>
                        </div>
                    </div>
                `;
            });
        }

        function openDetail(id) {
            const products = JSON.parse(localStorage.getItem('toko_products')) || [];
            const product = products.find(p => p.id === id);
            if (!product) return;

            // Memastikan data gambar diambil sebagai Array
            currentImages = (product.images && product.images.length > 0) ? product.images : [product.img];
            currentIndex = 0;

            document.getElementById('p-title').innerText = product.name;
            document.getElementById('p-price').innerText = "Rp " + product.price.toLocaleString('id-ID');
            document.getElementById('p-stock').innerText = "Stok Tersedia: " + product.stock;

            renderSlider();
            document.getElementById('detailModal').style.display = 'flex';
        }

        function renderSlider() {
            document.getElementById('main-slide-img').src = currentImages[currentIndex];
            const thumbsBox = document.getElementById('thumbs-box');
            thumbsBox.innerHTML = '';

            currentImages.forEach((img, idx) => {
                const thumb = document.createElement('img');
                thumb.src = img;
                thumb.className = `thumb ${idx === currentIndex ? 'active' : ''}`;
                thumb.onclick = () => {
                    currentIndex = idx;
                    renderSlider();
                };
                thumbsBox.appendChild(thumb);
            });
        }

        function changeSlide(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = currentImages.length - 1;
            if (currentIndex >= currentImages.length) currentIndex = 0;
            renderSlider();
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        window.onload = loadProducts;
    </script>
</body>
</html>
