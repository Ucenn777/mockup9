<!DOCTYPE html>
<html>
<head>

<title>Admin Toko</title>

<style>

body{
    font-family:Arial;
    margin:0;
    background:#f2f2f2;
}


/* LOGIN */

#login{
    width:300px;
    background:white;
    padding:20px;
    margin:100px auto;
    border-radius:15px;
    box-shadow:0 0 10px #aaa;
}


input{
    width:100%;
    padding:10px;
    margin:5px 0;
}


button{
    width:100%;
    padding:10px;
    margin:5px 0;
    background:#007bff;
    color:white;
    border:0;
    border-radius:8px;
}



/* ADMIN */

#admin{
    display:none;
}


.sidebar{

    width:220px;
    height:100vh;
    background:#222;
    color:white;
    position:fixed;
    padding:15px;

}


.sidebar button{

    background:#333;

}


.content{

    margin-left:250px;
    padding:20px;

}


.box{

    background:white;
    padding:20px;
    border-radius:15px;

}


.page{

    display:none;

}


table{

width:100%;
border-collapse:collapse;

}


td,th{

border:1px solid #ddd;
padding:10px;

}

</style>


</head>


<body>



<!-- LOGIN -->

<div id="login">

<h2>Login Admin</h2>

<input id="user" placeholder="Username">

<input id="pass" type="password" placeholder="Password">


<button onclick="login()">
Masuk
</button>


</div>




<!-- ADMIN PANEL -->

<div id="admin">



<div class="sidebar">

<h2>ADMIN</h2>


<button onclick="buka('dashboard')">
Dashboard
</button>


<button onclick="buka('tambah')">
Tambah Barang
</button>


<button onclick="buka('barang')">
Daftar Barang
</button>


<button onclick="logout()">
Logout
</button>


</div>




<div class="content">



<div id="dashboard" class="page" style="display:block">

<div class="box">

<h1>Dashboard</h1>

<p>Total Barang :
<b id="total">0</b>
</p>


</div>

</div>




<div id="tambah" class="page">

<div class="box">

<h2>Tambah Barang</h2>


<input id="nama" placeholder="Nama Barang">

<input id="harga" placeholder="Harga">


<input id="foto" placeholder="Link Foto">


<button onclick="tambahBarang()">
Simpan Barang
</button>


</div>

</div>






<div id="barang" class="page">

<div class="box">


<h2>Daftar Barang</h2>


<table>


<tr>

<th>Nama</th>
<th>Harga</th>
<th>Aksi</th>

</tr>


<tbody id="list"></tbody>


</table>


</div>

</div>




</div>


</div>





<script>


let barang=[];



function login(){


let u=document.getElementById("user").value;

let p=document.getElementById("pass").value;



if(u=="admin" && p=="12345"){


document.getElementById("login").style.display="none";

document.getElementById("admin").style.display="block";


ambilData();


}

else{

alert("Login salah");

}


}





function logout(){

location.reload();

}




function buka(id){


let halaman=document.querySelectorAll(".page");


halaman.forEach(function(x){

x.style.display="none";

});


document.getElementById(id).style.display="block";


}





function tambahBarang(){


let data={

nama:document.getElementById("nama").value,

harga:document.getElementById("harga").value,

foto:document.getElementById("foto").value

};


barang.push(data);


simpan();


tampil();


alert("Barang berhasil ditambah");


}





function simpan(){

localStorage.setItem(
"barang",
JSON.stringify(barang)
);


}




function ambilData(){


let data=localStorage.getItem("barang");


if(data){

barang=JSON.parse(data);

}


tampil();


}





function tampil(){


let html="";


barang.forEach(function(b,i){


html+=`

<tr>

<td>${b.nama}</td>

<td>${b.harga}</td>


<td>

<button onclick="hapus(${i})">
Hapus
</button>

</td>


</tr>


`;


});


document.getElementById("list").innerHTML=html;


document.getElementById("total").innerHTML=barang.length;


}




function hapus(i){


barang.splice(i,1);


simpan();

tampil();


}



</script>


</body>
</html>
