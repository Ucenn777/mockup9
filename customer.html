.cart{

<script>

{

deskripsi:"Jam tangan elegan untuk pria dan wanita."
},

{

nama:"Headphone",

gambar:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400",

},

{

nama:"Tas Selempang",
harga:210000,

">

location.href="detail.html";

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Produk</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#ff5722;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
display:flex;
gap:20px;
flex-wrap:wrap;
}

.kiri{
flex:1;
background:white;
padding:20px;
border-radius:10px;
}

.kiri img{
width:100%;
border-radius:10px;
}

.kanan{
flex:1;
background:white;
padding:20px;
border-radius:10px;
}

h2{
margin-bottom:10px;
}

.harga{
font-size:28px;
color:#ff5722;
font-weight:bold;
margin:15px 0;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:0;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

.cart{
background:#ff9800;
color:white;
}

.buy{
background:#ff5722;
color:white;
}

.qty{
display:flex;
gap:10px;
align-items:center;
margin-top:15px;
}

.qty button{
width:40px;
}

</style>

</head>

<body>

<header>

<h2>TokoOren</h2>

<a href="customer.html" style="color:white;text-decoration:none;">
⬅ Kembali
</a>

</header>

<div class="container">

<div class="kiri">

<img id="gambar">

</div>

<div class="kanan">

<h2 id="nama"></h2>

<div class="harga" id="harga"></div>

<p id="deskripsi"></p>

<br>

<b>Warna</b>

<select>
<option>Hitam</option>
<option>Putih</option>
<option>Merah</option>
</select>

<br><br>

<b>Jumlah</b>

<div class="qty">

<button onclick="kurang()">-</button>

<span id="jumlah">1</span>

<button onclick="tambah()">+</button>

</div>

<button class="cart" onclick="tambahCart()">

🛒 Tambah Keranjang

</button>

<button class="buy">

⚡ Beli Sekarang

</button>

</div>

</div>

<script>
let produk = JSON.parse(localStorage.getItem("produk")) || [];

let id = Number(localStorage.getItem("detailProduk"));

let barang = produk.find(function(p){
    return p.id == id;
});

// Jika belum ada produk dari admin, pakai contoh
if(!barang){
    barang = {
        id:1,
        nama:"Produk Contoh",
        harga:100000,
        gambar:"https://via.placeholder.com/400",
        deskripsi:"Produk belum ditambahkan oleh admin."
    };
}

document.getElementById("nama").innerHTML = barang.nama;
document.getElementById("harga").innerHTML = "Rp " + Number(barang.harga).toLocaleString("id-ID");
document.getElementById("gambar").src = barang.gambar;
document.getElementById("deskripsi").innerHTML = barang.deskripsi;

let jumlah = 1;

function tambah(){
    jumlah++;
    document.getElementById("jumlah").innerHTML = jumlah;
}

function kurang(){
    if(jumlah > 1){
        jumlah--;
        document.getElementById("jumlah").innerHTML = jumlah;
    }
}

function tambahCart(){

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push({
        id:barang.id,
        nama:barang.nama,
        harga:barang.harga,
        gambar:barang.gambar,
        jumlah:jumlah,
        total:barang.harga * jumlah
    });

    localStorage.setItem("cart", JSON.stringify(cart));

    alert("Barang berhasil ditambahkan ke keranjang!");

    location.href = "cart.html";
}
</script>

</body>
</html>
