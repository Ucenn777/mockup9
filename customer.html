<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TokoOren</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#ff5722;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
}

.logo{
color:white;
font-size:28px;
font-weight:bold;
}

.search{
width:45%;
}

.search input{
width:100%;
padding:10px;
border:0;
border-radius:5px;
}

.menu{
display:flex;
gap:15px;
align-items:center;
}

.menu a{
color:white;
text-decoration:none;
font-weight:bold;
}

.cart{
background:white;
padding:8px 12px;
border-radius:5px;
cursor:pointer;
font-weight:bold;
}

.container{
display:flex;
padding:20px;
gap:20px;
}

.left{
width:75%;
}

.right{
width:25%;
}

.banner{
background:#ff7043;
color:white;
padding:30px;
border-radius:10px;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
cursor:pointer;
box-shadow:0 2px 5px rgba(0,0,0,.15);
transition:.3s;
}

.card:hover{
transform:scale(1.03);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.info{
padding:10px;
}

.nama{
font-weight:bold;
margin-bottom:5px;
}

.harga{
color:#ff5722;
font-size:20px;
font-weight:bold;
}

.sidebar{
background:white;
border-radius:10px;
padding:15px;
}

.sidebar button{
width:100%;
padding:10px;
margin-top:10px;
background:#ff5722;
color:white;
border:0;
border-radius:5px;
cursor:pointer;
}

#popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
}

#detail{
background:white;
width:90%;
max-width:900px;
margin:40px auto;
padding:20px;
border-radius:10px;
}

</style>

</head>

<body>

<header>

<div class="logo">TokoOren</div>

<div class="search">
<input type="text" placeholder="Cari produk...">
</div>

<div class="menu">

<a href="admin.html">
Login Admin
</a>

<div class="cart">

🛒 <span id="badge">0</span>

</div>

</div>

</header>

<div class="container">

<div class="left">

<div class="banner">

<h2>Promo Besar Hari Ini 🔥</h2>

<p>Diskon hingga 50%</p>

</div>

<div class="grid" id="produk">

</div>

</div>

<div class="right">

<div class="sidebar">

<h3>Akun Customer</h3>

<button>Keranjang</button>

<button>Checkout</button>

<button>Pesanan Saya</button>

<button onclick="location.href='index.html'">
Logout
</button>

</div>

</div>

</div>

<div id="popup">

<div id="detail">

</div>

</div>

<script>
// ======================
// DATA PRODUK
// ======================

let produk = JSON.parse(localStorage.getItem("produk")) || [

{
id:1,
nama:"Sepatu Sneakers",
harga:250000,
gambar:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500",
deskripsi:"Sepatu nyaman untuk dipakai sehari-hari."
},

{
id:2,
nama:"Jam Tangan",
harga:150000,
gambar:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500",
deskripsi:"Jam tangan elegan dengan desain minimalis."
},

{
id:3,
nama:"Headphone",
harga:450000,
gambar:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500",
deskripsi:"Headphone bluetooth suara jernih."
},

{
id:4,
nama:"Tas Selempang",
harga:210000,
gambar:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500",
deskripsi:"Tas selempang keren dan tahan air."
}

];

let keranjang = JSON.parse(localStorage.getItem("keranjang")) || [];

document.getElementById("badge").innerHTML = keranjang.length;

tampilProduk();

function tampilProduk(){

let html="";

produk.forEach(function(p){

html += `

<div class="card" onclick="lihatProduk(${p.id})">

<img src="${p.gambar}">

<div class="info">

<div class="nama">${p.nama}</div>

<div class="harga">
Rp ${Number(p.harga).toLocaleString("id-ID")}
</div>

</div>

</div>

`;

});

document.getElementById("produk").innerHTML = html;

}

function lihatProduk(id){

let p = produk.find(x => x.id==id);

document.getElementById("popup").style.display="block";

document.getElementById("detail").innerHTML=`

<img src="${p.gambar}" style="width:100%;max-height:350px;object-fit:cover;border-radius:10px;">

<h2 style="margin-top:15px;">
${p.nama}
</h2>

<h1 style="color:#ff5722;">
Rp ${Number(p.harga).toLocaleString("id-ID")}
</h1>

<p>${p.deskripsi}</p>

<br>

<label>Warna</label>

<select style="width:100%;padding:10px;">
<option>Hitam</option>
<option>Putih</option>
<option>Merah</option>
</select>

<br><br>

<label>Jumlah</label>

<input id="jumlah" type="number" value="1" min="1" style="width:100%;padding:10px;">

<br><br>

<button onclick="tambahKeranjang(${p.id})"
style="width:100%;padding:12px;background:#ff5722;color:white;border:0;border-radius:5px;">

Tambah ke Keranjang

</button>

<br><br>

<button onclick="tutupPopup()"
style="width:100%;padding:12px;">

Tutup

</button>

`;

}

function tutupPopup(){

document.getElementById("popup").style.display="none";

}
function tambahKeranjang(id){

let p = produk.find(x=>x.id==id);

let jumlah = Number(document.getElementById("jumlah").value);

let keranjang = JSON.parse(localStorage.getItem("keranjang")) || [];

let ada = keranjang.find(x=>x.id==id);

if(ada){

ada.jumlah += jumlah;
ada.total = ada.jumlah * ada.harga;

}else{

keranjang.push({

id:p.id,
nama:p.nama,
harga:p.harga,
gambar:p.gambar,
jumlah:jumlah,
total:p.harga*jumlah

});

}

localStorage.setItem(
"keranjang",
JSON.stringify(keranjang)
);

document.getElementById("badge").innerHTML=keranjang.length;

alert("Berhasil ditambahkan ke keranjang!");

tutupPopup();

}

document.querySelector(".sidebar button").onclick=function(){

let keranjang=JSON.parse(localStorage.getItem("keranjang"))||[];

let html="<h2>Keranjang</h2>";

if(keranjang.length==0){

html+="<p>Keranjang masih kosong.</p>";

}else{

keranjang.forEach(function(k,index){

html+=`

<div style="border:1px solid #ddd;padding:10px;margin-top:10px;border-radius:8px;">

<input type="checkbox" checked id="cek${index}">

<img src="${k.gambar}" width="70">

<h3>${k.nama}</h3>

<p>Jumlah : ${k.jumlah}</p>

<p>Rp ${Number(k.total).toLocaleString('id-ID')}</p>

</div>

`;

});

html+=`

<button onclick="checkout()"
style="width:100%;padding:12px;margin-top:15px;background:#ff5722;color:white;border:0;border-radius:6px;">

Checkout

</button>

`;

}

document.getElementById("detail").innerHTML=html;

document.getElementById("popup").style.display="block";

}

function checkout(){

let keranjang=JSON.parse(localStorage.getItem("keranjang"))||[];

let pesanan=JSON.parse(localStorage.getItem("pesanan"))||[];

keranjang.forEach(function(k){

pesanan.push({

nama:k.nama,

harga:k.harga,

jumlah:k.jumlah,

total:k.total,

status:"Menunggu"

});

});

localStorage.setItem(
"pesanan",
JSON.stringify(pesanan)
);

localStorage.removeItem("keranjang");

document.getElementById("badge").innerHTML="0";

alert("Checkout berhasil!");

tutupPopup();

}
// ===========================
// FITUR SEARCH
// ===========================

const cari = document.querySelector(".search input");

cari.addEventListener("keyup", function(){

let keyword = this.value.toLowerCase();

let hasil = produk.filter(function(p){

return p.nama.toLowerCase().includes(keyword);

});

let html="";

hasil.forEach(function(p){

html += `

<div class="card" onclick="lihatProduk(${p.id})">

<img src="${p.gambar}">

<div class="info">

<div class="nama">${p.nama}</div>

<div class="harga">

Rp ${Number(p.harga).toLocaleString("id-ID")}

</div>

</div>

</div>

`;

});

document.getElementById("produk").innerHTML = html;

});

// ===========================
// TUTUP POPUP KLIK LUAR
// ===========================

window.onclick=function(e){

if(e.target==document.getElementById("popup")){

tutupPopup();

}

}

// ===========================
// TUTUP FILE
// ===========================

</script>

</body>
</html>
