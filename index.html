<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TokoKu - Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ee4d2d,#ff8a50);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:#fff;
width:90%;
max-width:400px;
padding:30px;
border-radius:15px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.logo{
font-size:60px;
}

h1{
margin:15px 0;
color:#ee4d2d;
}

p{
color:#666;
margin-bottom:25px;
}

button{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.customer{
background:#ee4d2d;
color:#fff;
}

.customer:hover{
background:#d84326;
}

.admin{
background:#333;
color:#fff;
}

.admin:hover{
background:#111;
}

.footer{
margin-top:20px;
font-size:13px;
color:#888;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">🛒</div>

<h1>TokoKu</h1>

<p>Sistem Penjualan Online</p>

<button class="customer"
onclick="location.href='customer.html'">
👤 Login Customer
</button>

<button class="admin"
onclick="location.href='admin.html'">
👨‍💼 Login Admin
</button>

<div class="footer">
© 2026 TokoKu
</div>

</div>

</body>
</html>
