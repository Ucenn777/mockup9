<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TokoOren</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

/* HEADER */

header{

background:#ff5722;

padding:15px;

display:flex;

align-items:center;

justify-content:space-between;

position:sticky;

top:0;

z-index:100;

gap:15px;

}

.logo{

font-size:28px;

font-weight:bold;

color:white;

}

.search{

flex:1;

}

.search input{

width:100%;

padding:12px;

border:0;

border-radius:8px;

outline:none;

}

.menu{

display:flex;

align-items:center;

gap:10px;

}

.menu button{

padding:10px 15px;

border:0;

background:white;

border-radius:8px;

cursor:pointer;

font-weight:bold;

}

.cart{

position:relative;

}

.badge{

position:absolute;

top:-8px;

right:-8px;

background:red;

color:white;

border-radius:50%;

padding:3px 7px;

font-size:12px;

}

/* ISI */

.container{

display:flex;

gap:20px;

padding:20px;

}

/* MENU KIRI */

.sidebar{

width:220px;

background:white;

border-radius:10px;

padding:15px;

height:fit-content;

}

.sidebar h3{

margin-bottom:15px;

}

.sidebar button{

width:100%;

padding:12px;

margin-bottom:10px;

background:#ff5722;

color:white;

border:0;

border-radius:8px;

cursor:pointer;

}

/* PRODUK */

.content{

flex:1;

}

.banner{

background:linear-gradient(45deg,#ff5722,#ff9800);

color:white;

padding:30px;

border-radius:10px;

margin-bottom:20px;

}

.grid{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:15px;

}

.card{

background:white;

border-radius:10px;

overflow:hidden;

cursor:pointer;

transition:.2s;

box-shadow:0 2px 5px rgba(0,0,0,.1);

}

.card:hover{

transform:translateY(-4px);

}

.card img{

width:100%;

aspect-ratio:1/1;

object-fit:cover;

}

.info{

padding:10px;

}

.nama{

font-weight:bold;

height:40px;

overflow:hidden;

}

.rating{

color:#ff9800;

font-size:14px;

margin-top:5px;

}

.terjual{

font-size:13px;

color:gray;

}

.harga{

color:#ff5722;

font-size:20px;

font-weight:bold;

margin-top:8px;

}

/* DETAIL */

#popup{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.6);

overflow:auto;

z-index:999;

}

#detail{

background:white;

width:95%;

max-width:900px;

margin:30px auto;

border-radius:10px;

padding:20px;

}

/* RESPONSIVE */

@media(max-width:900px){

.container{

flex-direction:column;

}

.sidebar{

width:100%;

}

.grid{

grid-template-columns:repeat(2,1fr);

}

header{

flex-wrap:wrap;

}

}

</style>

</head>

<body>

<header>

<div class="logo">

TokoOren

</div>

<div class="search">

<input id="cari" placeholder="Cari produk...">

</div>

<div class="menu">

<button onclick="location.href='admin.html'">

Login Admin

</button>

<button class="cart">

🛒

<span class="badge" id="badge">

0

</span>

</button>

</div>

</header>

<div class="container">

<div class="sidebar">

<h3>☰ MENU</h3>

<button>🏠 Home</button>

<button>🛒 Keranjang</button>

<button>💳 Checkout</button>

<button>📦 Pesanan Saya</button>

<button onclick="location.href='index.html'">

🚪 Logout

</button>

</div>

<div class="content">

<div class="banner">

<h2>🔥 Promo Hari Ini</h2>

<p>Diskon sampai 50%</p>

</div>

<div class="grid" id="produk">

</div>

</div>

</div>

<div id="popup">

<div id="detail">

</div>

</div>

<script>
// ==========================
// DATA PRODUK
// ==========================

let produk = JSON.parse(localStorage.getItem("produk")) || [

{
id:1,
nama:"iPhone 15 Pro Max",
harga:18999000,
rating:"4.9",
terjual:"2,5RB",
gambar:"https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=600",
deskripsi:"iPhone 15 Pro Max Garansi Resmi."
},

{
id:2,
nama:"Samsung S25 Ultra",
harga:17999000,
rating:"4.9",
terjual:"1,8RB",
gambar:"https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=600",
deskripsi:"Samsung Flagship."
},

{
id:3,
nama:"Nike Air Force 1",
harga:1599000,
rating:"4.8",
terjual:"3,2RB",
gambar:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600",
deskripsi:"Sepatu Original."
},

{
id:4,
nama:"Headset JBL",
harga:599000,
rating:"4.8",
terjual:"980",
gambar:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600",
deskripsi:"Bass Mantap."
},

{
id:5,
nama:"Keyboard Gaming",
harga:399000,
rating:"4.7",
terjual:"760",
gambar:"https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?w=600",
deskripsi:"RGB Mechanical."
},

{
id:6,
nama:"Mouse Gaming",
harga:259000,
rating:"4.9",
terjual:"1,1RB",
gambar:"https://images.unsplash.com/photo-1527814050087-3793815479db?w=600",
deskripsi:"RGB 7200 DPI."
},

{
id:7,
nama:"Tas Eiger",
harga:450000,
rating:"4.9",
terjual:"890",
gambar:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600",
deskripsi:"Tas Original."
},

{
id:8,
nama:"Jam Casio",
harga:799000,
rating:"4.8",
terjual:"650",
gambar:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600",
deskripsi:"Jam Original."
}

];

localStorage.setItem("produk",JSON.stringify(produk));

let html="";

produk.forEach(function(p){

html+=`

<div class="card" onclick="detailProduk(${p.id})">

<img src="${p.gambar}">

<div class="info">

<div class="nama">

${p.nama}

</div>

<div class="rating">

⭐⭐⭐⭐⭐ ${p.rating}

</div>

<div class="terjual">

Terjual ${p.terjual}

</div>

<div class="harga">

Rp ${Number(p.harga).toLocaleString("id-ID")}

</div>

</div>

</div>

`;

});

document.getElementById("produk").innerHTML=html;
// ==========================
// DETAIL PRODUK
// ==========================

function detailProduk(id){

let p = produk.find(function(x){
return x.id==id;
});

document.getElementById("popup").style.display="block";

document.getElementById("detail").innerHTML=`

<div style="display:flex;flex-wrap:wrap;gap:20px;">

<div style="flex:1;min-width:280px;">

<img src="${p.gambar}"
style="width:100%;border-radius:10px;">

</div>

<div style="flex:1;min-width:280px;">

<h2>${p.nama}</h2>

<p style="color:#ff9800;font-size:18px;">
⭐⭐⭐⭐⭐ ${p.rating}
</p>

<p style="color:gray;">
Terjual ${p.terjual}
</p>

<h1 style="color:#ff5722;margin:15px 0;">
Rp ${Number(p.harga).toLocaleString("id-ID")}
</h1>

<p>${p.deskripsi}</p>

<br>

<b>Warna</b>

<br><br>

<select id="warna"
style="width:100%;padding:10px;">

<option>Hitam</option>

<option>Putih</option>

<option>Merah</option>

<option>Biru</option>

</select>

<br><br>

<b>Jumlah</b>

<div style="display:flex;gap:10px;align-items:center;margin-top:10px;">

<button onclick="kurang()">-</button>

<input id="jumlah"
value="1"
style="width:60px;text-align:center;">

<button onclick="tambah()">+</button>

</div>

<br>

<button
onclick="tambahKeranjang(${p.id})"
style="width:100%;
padding:12px;
background:#ff5722;
color:white;
border:0;
border-radius:8px;">

🛒 Tambah Keranjang

</button>

<br><br>

<button
style="width:100%;
padding:12px;
background:#16a34a;
color:white;
border:0;
border-radius:8px;">

⚡ Beli Sekarang

</button>

<br><br>

<button
onclick="tutupPopup()"
style="width:100%;
padding:12px;">

Tutup

</button>

</div>

</div>

`;

}

function tutupPopup(){

document.getElementById("popup").style.display="none";

}

function tambah(){

let j=document.getElementById("jumlah");

j.value=Number(j.value)+1;

}

function kurang(){

let j=document.getElementById("jumlah");

if(Number(j.value)>1){

j.value=Number(j.value)-1;

}

}
// ==========================
// KERANJANG
// ==========================

function tambahKeranjang(id){

let p=produk.find(x=>x.id==id);

let jumlah=Number(document.getElementById("jumlah").value);

let warna=document.getElementById("warna").value;

let keranjang=JSON.parse(localStorage.getItem("keranjang"))||[];

let cek=keranjang.find(x=>x.id==id && x.warna==warna);

if(cek){

cek.jumlah+=jumlah;

}else{

keranjang.push({

id:p.id,

nama:p.nama,

harga:p.harga,

gambar:p.gambar,

warna:warna,

jumlah:jumlah,

rating:p.rating,

terjual:p.terjual,

total:p.harga*jumlah

});

}

localStorage.setItem(

"keranjang",

JSON.stringify(keranjang)

);

document.getElementById("badge").innerHTML=keranjang.length;

alert("Produk berhasil ditambahkan ke keranjang");

tutupPopup();

}

// ==========================
// BUKA KERANJANG
// ==========================

document.querySelector(".cart").onclick=function(){

let keranjang=JSON.parse(localStorage.getItem("keranjang"))||[];

let total=0;

let html="<h2>🛒 Keranjang</h2><hr>";

if(keranjang.length==0){

html+="<p>Keranjang masih kosong.</p>";

}else{

keranjang.forEach(function(k,i){

total+=k.total;

html+=`

<div style="display:flex;gap:10px;margin:15px 0;">

<img src="${k.gambar}"

style="width:90px;height:90px;object-fit:cover;border-radius:10px;">

<div>

<b>${k.nama}</b><br>

Warna : ${k.warna}<br>

Jumlah : ${k.jumlah}<br>

Rp ${Number(k.total).toLocaleString("id-ID")}

</div>

</div>

`;

});

html+=`

<hr>

<h2>Total :

Rp ${Number(total).toLocaleString("id-ID")}

</h2>

<br>

<button onclick="checkout()"

style="width:100%;

padding:12px;

background:#16a34a;

color:white;

border:0;

border-radius:8px;">

Checkout

</button>

`;

}

html+=`

<br><br>

<button onclick="tutupPopup()"

style="width:100%;padding:12px;">

Tutup

</button>

`;

document.getElementById("detail").innerHTML=html;

document.getElementById("popup").style.display="block";

}

// ==========================
// CHECKOUT
// ==========================

function checkout(){

let keranjang=JSON.parse(localStorage.getItem("keranjang"))||[];

let pesanan=JSON.parse(localStorage.getItem("pesanan"))||[];

keranjang.forEach(function(k){

pesanan.push({

nama:k.nama,

harga:k.harga,

jumlah:k.jumlah,

warna:k.warna,

total:k.total,

status:"Menunggu"

});

});

localStorage.setItem(

"pesanan",

JSON.stringify(pesanan)

);

localStorage.removeItem("keranjang");

document.getElementById("badge").innerHTML="0";

alert("Checkout berhasil");

location.reload();

}
// ==========================
// SEARCH PRODUK
// ==========================

document.getElementById("cari").onkeyup=function(){

let key=this.value.toLowerCase();

let html="";

produk.filter(function(p){

return p.nama.toLowerCase().includes(key);

}).forEach(function(p){

html+=`

<div class="card" onclick="detailProduk(${p.id})">

<img src="${p.gambar}">

<div class="info">

<div class="nama">${p.nama}</div>

<div class="rating">

⭐⭐⭐⭐⭐ ${p.rating}

</div>

<div class="terjual">

Terjual ${p.terjual}

</div>

<div class="harga">

Rp ${Number(p.harga).toLocaleString("id-ID")}

</div>

</div>

</div>

`;

});

document.getElementById("produk").innerHTML=html;

}

// ==========================
// WISHLIST
// ==========================

let wishlist=JSON.parse(localStorage.getItem("wishlist"))||[];

function favorit(id){

let p=produk.find(x=>x.id==id);

if(!wishlist.find(x=>x.id==id)){

wishlist.push(p);

localStorage.setItem(

"wishlist",

JSON.stringify(wishlist)

);

alert("Produk ditambahkan ke Wishlist ❤️");

}

}

// ==========================
// TUTUP POPUP SAAT KLIK LUAR
// ==========================

window.onclick=function(e){

if(e.target==document.getElementById("popup")){

tutupPopup();

}

}

// ==========================
// UPDATE BADGE KERANJANG
// ==========================

document.getElementById("badge").innerHTML=
(JSON.parse(localStorage.getItem("keranjang"))||[]).length;

// ==========================
// AKHIR FILE
// ==========================

</script>

</body>

</html>
