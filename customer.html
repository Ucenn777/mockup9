<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TokoOren</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}

header{
background:#ff5722;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
}

.logo{
font-size:22px;
font-weight:bold;
}

.menu a{
color:white;
text-decoration:none;
margin-left:15px;
font-weight:bold;
}

.search{
padding:15px;
}

.search input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
}

.banner{
margin:15px;
background:orange;
color:white;
padding:30px;
border-radius:10px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.produk{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:15px;
}

.card{
background:white;
border-radius:10px;
padding:10px;
box-shadow:0 0 5px #ccc;
}

.card img{
width:100%;
border-radius:8px;
cursor:pointer;
}

.nama{
margin-top:10px;
font-weight:bold;
}

.harga{
color:#ff5722;
margin:8px 0;
font-weight:bold;
}

button{
width:100%;
padding:10px;
background:#ff5722;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<header>

<div class="logo">🛒 TokoOren</div>

<div class="menu">

<a href="keranjang.html">🛒</a>

<a href="pesanan.html">📦</a>

<a href="../index.html">Logout</a>

</div>

</header>

<div class="search">
<input placeholder="Cari produk...">
</div>

<div class="banner">
Diskon Hingga 50%
</div>

<div class="produk">

<div class="card">

<img src="https://picsum.photos/300?1"
onclick="detail('Sepatu Sneakers',250000)">

<div class="nama">
Sepatu Sneakers
</div>

<div class="harga">
Rp250.000
</div>

<button onclick="keranjang('Sepatu Sneakers',250000)">
+ Keranjang
</button>

</div>

<div class="card">

<img src="https://picsum.photos/300?2"
onclick="detail('Jam Tangan',150000)">

<div class="nama">
Jam Tangan
</div>

<div class="harga">
Rp150.000
</div>

<button onclick="keranjang('Jam Tangan',150000)">
+ Keranjang
</button>

</div>

</div>

<script>

function detail(nama,harga){

localStorage.setItem("detailNama",nama);

localStorage.setItem("detailHarga",harga);

location.href="detail.html";

}

function keranjang(nama,harga){

let cart=JSON.parse(localStorage.getItem("cart"))||[];

cart.push({
nama:nama,
harga:harga
});

localStorage.setItem("cart",JSON.stringify(cart));

alert("Barang masuk keranjang");

}

</script>

</body>
</html>
