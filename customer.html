<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Fadli Jaya - Exclusive Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8f9fa; color: #222; }

        header { 
            background: #fff; border-bottom: 1px solid #e5e7eb; padding: 12px 20px; 
            display: flex; align-items: center; justify-content: space-between; 
            position: sticky; top: 0; z-index: 100;
        }

        .logo { font-size: 18px; font-weight: 700; color: #b8972e; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
        
        .header-right { display: flex; align-items: center; gap: 10px; }
        
        .btn-nav { 
            background: #fff; color: #b8972e; border: 1px solid #b8972e; padding: 7px 14px; 
            border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; text-decoration: none;
        }
        .btn-nav.primary { background: #b8972e; color: #fff; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px 15px; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }

        .product-card { 
            background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; 
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .product-img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; }
        .product-name { font-size: 13px; font-weight: 600; color: #1e293b; margin-bottom: 4px; }
        .product-price { font-size: 13px; font-weight: bold; color: #b8972e; margin-bottom: 10px; }

        .btn-buy { 
            background: #b8972e; color: #fff; border: none; padding: 8px; 
            border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; width: 100%;
        }

        /* MODAL */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); 
            display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px;
        }
        .modal-content { background: #fff; border-radius: 10px; max-width: 420px; width: 100%; padding: 20px; position: relative; }
        .close-modal { position: absolute; top: 10px; right: 10px; border: none; background: transparent; font-size: 18px; cursor: pointer; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 10px; font-weight: bold; margin-bottom: 4px; color: #475569; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 11px; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="location.reload()">Toko Fadli Jaya</div>
        <div class="header-right">
            <button class="btn-nav" onclick="openCartModal()">🛒 Keranjang (<span id="cart-count">0</span>)</button>
            <a href="admin.html" class="btn-nav primary">👤 Admin</a>
        </div>
    </header>

    <main class="container">
        <h3 style="margin-bottom: 15px; font-size: 14px; text-transform: uppercase; color: #334155;">Katalog Produk Terbaru</h3>
        <div class="product-grid" id="product-grid"></div>
    </main>

    <div class="modal-overlay" id="checkout-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('checkout-modal')">&times;</button>
            <h3 style="margin-bottom: 12px; color: #b8972e; font-size: 14px;">Formulir Pembelian</h3>
            <form onsubmit="finalizeCheckout(event)">
                <div class="form-group"><label>Nama Pembeli</label><input type="text" id="cust-name" required placeholder="Nama Anda..."></div>
                <div class="form-group"><label>Nomor Telepon</label><input type="tel" id="cust-phone" required placeholder="08123456789"></div>
                <div class="form-group"><label>Alamat Lengkap</label><textarea id="cust-address" rows="2" required placeholder="Alamat pengiriman..."></textarea></div>
                <button type="submit" class="btn-buy" style="margin-top: 10px;">Konfirmasi & Bayar</button>
            </form>
        </div>
    </div>

    <script>
        let cart = [];
        let selectedProductForBuy = null;

        window.onload = function() {
            renderProducts();
        };

        function getProducts() { return JSON.parse(localStorage.getItem('toko_products')) || []; }

        function renderProducts() {
            const products = getProducts();
            const grid = document.getElementById("product-grid");
            grid.innerHTML = "";

            if (products.length === 0) {
                grid.innerHTML = "<p style='grid-column: span 4; text-align:center; color:#64748b;'>Belum ada produk yang dijual dari menu Admin.</p>";
                return;
            }

            products.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img}" class="product-img">
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">Rp ${p.price.toLocaleString('id-ID')}</div>
                        <button class="btn-buy" onclick="buyProduct(${p.id})">Beli Sekarang</button>
                    </div>
                `;
            });
        }

        function buyProduct(id) {
            selectedProductForBuy = getProducts().find(p => p.id === id);
            if(selectedProductForBuy) {
                document.getElementById('checkout-modal').style.display = 'flex';
            }
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function finalizeCheckout(e) {
            e.preventDefault();
            if(!selectedProductForBuy) return;

            let name = document.getElementById("cust-name").value;
            let phone = document.getElementById("cust-phone").value;
            let address = document.getElementById("cust-address").value;

            let sales = JSON.parse(localStorage.getItem('toko_sales')) || [];
            
            // Simpan data transaksi baru
            sales.push({ 
                id: Math.floor(1000 + Math.random() * 9000), 
                date: new Date().toLocaleDateString('id-ID'), 
                customer: `${name} (${phone})`, 
                items: selectedProductForBuy.name, 
                total: selectedProductForBuy.price 
            });

            localStorage.setItem('toko_sales', JSON.stringify(sales));

            // Kurangi stok
            let prods = getProducts();
            let p = prods.find(item => item.id === selectedProductForBuy.id);
            if(p && p.stock > 0) p.stock -= 1;
            localStorage.setItem('toko_products', JSON.stringify(prods));

            closeModal('checkout-modal');
            alert("🎉 Pembelian Berhasil! Data penjualan dan grafik di Admin telah otomatis ter-update.");
            renderProducts();
        }
    </script>
</body>
</html>
