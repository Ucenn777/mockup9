<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TOKO UCEN JAYA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #1a2332; display: flex; justify-content: center; align-items: center; }
    
    .login-card {
      background: #ffffff; padding: 35px 25px; border-radius: 12px; width: 90%; max-width: 400px;
      text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .login-card h2 { color: #b8972e; margin-bottom: 8px; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
    .login-card p { font-size: 12px; color: #64748b; margin-bottom: 20px; }
    
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 5px; color: #475569; text-transform: uppercase; }
    select, button { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 13px; outline: none; }
    button { background: #b8972e; color: #fff; font-weight: bold; border: none; cursor: pointer; text-transform: uppercase; margin-top: 10px; transition: 0.2s; }
    button:hover { background: #9c7d23; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>TOKO UCEN JAYA</h2>
    <p>Pilih Mode Akses Sistem Toko</p>
    
    <div class="form-group">
      <label>Mode Masuk</label>
      <select id="roleSelect">
        <option value="customer">Customer / Pembeli</option>
        <option value="admin">Admin Toko</option>
      </select>
    </div>

    <button onclick="masukToko()">MASUK KE TOKO</button>
  </div>

  <script>
    function masukToko() {
      const role = document.getElementById('roleSelect').value;
      if (role === 'admin') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'customer.html';
      }
    }
  </script>
</body>
</html>
