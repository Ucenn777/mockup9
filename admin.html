<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokoKu - Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: #f4f6f8;
            color: #333;
            min-height: 100vh;
        }

        /* 1. SECTION LOGIN */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 15px;
        }

        #auth-card { 
            max-width: 380px; width: 100%; background: #fff; padding: 28px 20px; border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; border-top: 4px solid #ee4d2d;
        }
        #auth-card h2 { color: #ee4d2d; margin-bottom: 6px; font-size: 20px; text-transform: uppercase; }

        /* 2. DASHBOARD MAIN PANEL (FULL DESKTOP) */
        .admin-layout {
            display: none; /* Controlled via JS */
            width: 100%; 
            min-height: 100vh; 
            background: #f8f9fa; 
            flex-direction: column;
        }

        @media (min-width: 768px) { 
            .admin-layout { 
                flex-direction: row; 
                min-height: 100vh;
            } 
        }

        /* 3. SIDEBAR KIRI */
        .side-nav { 
            width: 100%; 
            background: #1e1e1e; 
            color: #fff; 
            padding: 20px 15px; 
            display: flex; 
            flex-direction: column; 
            flex-shrink: 0;
        }

        @media (min-width: 768px) { 
            .side-nav { 
                width: 250px; 
                min-height: 100vh; 
            } 
        }
        
        .user-badge { text-align: center; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .user-badge .avatar { width: 48px; height: 48px; border-radius: 50%; background: #ee4d2d; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; margin: 0 auto 10px auto; }
        .user-badge .username { font-size: 14px; font-weight: bold; }

        .menu-list { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        
        .menu-item {
            background: transparent; border: none; color: #aaa; padding: 12px 16px; text-align: left;
            border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s;
            width: 100%; display: flex; align-items: center; gap: 10px; text-transform: uppercase;
        }
        .menu-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .menu-item.active { background: #ee4d2d; color: #fff; }
        
        /* TOMBOL KELUAR DI SIDEBAR */
        .btn-logout {
            margin-top: 20px;
            background: #dc3545;
            color: #fff;
            border: none;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .btn-logout:hover { background: #bd2130; }

        /* 4. AREA KONTEN KANAN */
        .content-area { 
            flex: 1; 
            padding: 25px 30px; 
            background: #f4f6f8;
            width: 100%;
        }

        .header-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            border-bottom: 2px solid #e2e8f0; 
            padding-bottom: 12px; 
        }
        .header-bar h2 { font-size: 18px; font-weight: bold; color: #1a202c; text-transform: uppercase; }

        /* 5. FORM CARD */
        .form-card {
            background: #ffffff; 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
            width: 100%;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
            .form-grid .full-width {
                grid-column: span 2;
            }
        }

        .form-row { text-align: left; }
        .form-row label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 6px; color: #4a5568; text-transform: uppercase; }
        .form-row input, .form-row select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 12px; outline: none; background: #fff; }

        .btn-action { 
            background: #ee4d2d; color: #fff; border: none; padding: 12px 20px; 
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; text-transform: uppercase;
            transition: 0.2s; width: 100%; margin-top: 5px;
        }
        .btn-action:hover { background: #d73211; }

        .img-preview-container { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .img-preview-container img { width: 65px; height: 65px; object-fit: cover; border-radius: 6px; border: 2px solid #ee4d2d; }

        /* 6. TABEL PRODUK */
        .data-table-container { 
            width: 100%; 
            overflow-x: auto; 
            background: #fff; 
            border-radius: 8px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
        }
        table { width: 100%; border-collapse: collapse; font-size: 12px; color: #2d3748; min-width: 600px; }
        table th, table td { border-bottom: 1px solid #edf2f7; padding: 14px 16px; text-align: left; }
        table th { background: #f7fafc; color: #4a5568; font-weight: bold; text-transform: uppercase; }

        /* MODAL PREVIEW */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 10000; justify-content: center; align-items: center; padding: 15px;
        }
        .modal-card {
            background: #fff; border-radius: 8px; max-width: 500px; width: 100%; 
            padding: 20px; position: relative; max-height: 90vh; overflow-y: auto;
        }
        .close-modal { position: absolute; top: 10px; right: 15px; font-size: 22px; cursor: pointer; color: #888; font-weight: bold; }

        .slider-box { position: relative; width: 100%; height: 260px; background: #000; border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
        .slider-box img { width: 100%; height: 100%; object-fit: contain; }
        .arrow-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; font-size: 16px; padding: 8px 12px; cursor: pointer; border-radius: 3px; }
        .arrow-btn.left { left: 5px; }
        .arrow-btn.right { right: 5px; }
        .thumbs-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 5px; }
        .thumb-img { width: 45px; height: 45px; border-radius: 4px; border: 2px solid #ddd; object-fit: cover; cursor: pointer; opacity: 0.6; flex-shrink: 0; }
        .thumb-img.active { border-color: #ee4d2d; opacity: 1; }
    </style>
</head>
<body>

    <div class="login-wrapper" id="login-wrapper">
        <div id="auth-card">
            <h2>🔒 Panel Admin</h2>
            <p style="font-size: 11px; color: #777; margin-bottom: 14px;">Masukkan password untuk masuk.</p>
            <form onsubmit="handleAdminLogin(event)">
                <div class="form-row">
                    <input type="password" id="admin-password" required placeholder="Password (admin123)...">
                </div>
                <button type="submit" class="btn-action">Masuk Sekarang</button>
            </form>
        </div>
    </div>

    <div class="admin-layout" id="admin-main-panel">
        <div class="side-nav">
            <div class="user-badge">
                <div class="avatar">A</div>
                <div class="username">Admin TokoKu</div>
                <div style="font-size: 11px; color: #aaa;">Manager Utama</div>
            </div>

            <div class="menu-list">
                <button class="menu-item active" onclick="switchTab('input', this)">➕ Tambah Barang</button>
                <button class="menu-item" onclick="switchTab('view', this)">📦 Stok Produk</button>
            </div>

            <button onclick="adminLogout()" class="btn-logout">🚪 Keluar Ke Login</button>
        </div>

        <div class="content-area">
            <div class="header-bar">
                <h2 id="current-section-title">Tambah Barang Baru</h2>
                <button onclick="adminLogout()" style="background:#ee4d2d; color:#fff; border:none; padding: 8px 14px; border-radius:4px; font-size:11px; font-weight:bold; cursor:pointer;">Keluar</button>
            </div>

            <div id="tab-input" class="tab-content">
                <div class="form-card">
                    <form id="add-product-form" onsubmit="handleAddNewProduct(event)">
                        <div class="form-grid">
                            <div class="form-row">
                                <label>Nama Produk</label>
                                <input type="text" id="new-name" required placeholder="Contoh: Headphones Wireless">
                            </div>
                            <div class="form-row">
                                <label>Kategori</label>
                                <select id="new-category" required>
                                    <option value="Gaming">Gaming</option>
                                    <option value="Elektronik">Elektronik</option>
                                    <option value="Sepatu">Sepatu</option>
                                    <option value="Aksesoris">Aksesoris</option>
                                </select>
                            </div>
                            <div class="form-row">
                                <label>Harga (Rp)</label>
                                <input type="number" id="new-price" required placeholder="Contoh: 250000">
                            </div>
                            <div class="form-row">
                                <label>Jumlah Stok Awal</label>
                                <input type="number" id="new-stock" value="10" required>
                            </div>
                            <div class="form-row full-width">
                                <label>Upload Foto Produk (Pilih >1 Foto Sekaligus)</label>
                                <input type="file" id="new-img-file" accept="image/*" multiple required onchange="previewImages(event)">
                                <div id="image-previews" class="img-preview-container"></div>
                            </div>
                            <div class="full-width">
                                <button type="submit" class="btn-action">Simpan Produk</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div id="tab-view" class="tab-content" style="display: none;">
                <div class="data-table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Foto</th>
                                <th>Nama Produk</th>
                                <th>Harga</th>
                                <th>Stok</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="admin-product-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="productDetailModal">
        <div class="modal-card">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div class="slider-box">
                <button class="arrow-btn left" onclick="navigateGallery(-1)">❮</button>
                <img id="modal-main-img" src="">
                <button class="arrow-btn right" onclick="navigateGallery(1)">❯</button>
            </div>
            <div class="thumbs-row" id="modal-thumbs-container"></div>
            <h3 id="modal-title" style="margin-top:10px;">-</h3>
            <p id="modal-price" style="color:#ee4d2d; font-weight:bold; font-size:16px;">Rp 0</p>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "admin123";
        let tempImagesBase64 = [];
        let currentActiveImages = [];
        let currentImageIndex = 0;

        window.onload = function() {
            if (!localStorage.getItem('toko_products')) {
                localStorage.setItem('toko_products', JSON.stringify([]));
            }
            if(localStorage.getItem('toko_admin_logged') === 'true') {
                showAdminPanelDirect();
            } else {
                showLoginDirect();
            }
        };

        function handleAdminLogin(e) {
            e.preventDefault();
            if(document.getElementById("admin-password").value === ADMIN_PASSWORD) {
                localStorage.setItem('toko_admin_logged', 'true');
                showAdminPanelDirect();
            } else {
                alert("Password salah! (Password: admin123)");
            }
        }

        function showAdminPanelDirect() {
            document.getElementById("login-wrapper").style.display = "none";
            document.getElementById("admin-main-panel").style.display = "flex";
            renderAdminProductTable();
        }

        function showLoginDirect() {
            document.getElementById("login-wrapper").style.display = "flex";
            document.getElementById("admin-main-panel").style.display = "none";
        }

        /* LOGIKA LOGOUT FIX */
        function adminLogout() {
            localStorage.removeItem('toko_admin_logged');
            document.getElementById("admin-password").value = "";
            showLoginDirect();
        }

        function getProducts() { return JSON.parse(localStorage.getItem('toko_products')) || []; }
        function saveProducts(prods) { localStorage.setItem('toko_products', JSON.stringify(prods)); }

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.menu-item').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.getElementById('tab-' + tabName).style.display = 'block';

            const sectionTitle = document.getElementById('current-section-title');
            if(tabName === 'input') {
                sectionTitle.innerText = "Tambah Barang Baru";
            } else {
                sectionTitle.innerText = "Daftar Stok Produk";
                renderAdminProductTable();
            }
        }

        function previewImages(event) {
            const container = document.getElementById("image-previews");
            container.innerHTML = "";
            tempImagesBase64 = [];
            const files = Array.from(event.target.files);

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempImagesBase64.push(e.target.result);
                    const img = document.createElement("img");
                    img.src = e.target.result;
                    container.appendChild(img);
                }
                reader.readAsDataURL(file);
            });
        }

        function handleAddNewProduct(e) {
            e.preventDefault();
            if (tempImagesBase64.length === 0) {
                alert("Pilih minimal 1 foto produk!");
                return;
            }

            let prods = getProducts();
            prods.push({
                id: Date.now(),
                name: document.getElementById("new-name").value,
                category: document.getElementById("new-category").value,
                price: parseInt(document.getElementById("new-price").value),
                img: tempImagesBase64[0],
                images: tempImagesBase64,
                stock: parseInt(document.getElementById("new-stock").value)
            });

            saveProducts(prods);
            alert(`✅ Produk berhasil disimpan dengan ${tempImagesBase64.length} foto!`);
            document.getElementById("add-product-form").reset();
            document.getElementById("image-previews").innerHTML = "";
            tempImagesBase64 = [];
            switchTab('view', document.querySelectorAll('.menu-item')[1]);
        }

        function renderAdminProductTable() {
            const tbody = document.getElementById("admin-product-table-body");
            tbody.innerHTML = "";
            let prods = getProducts();

            if(prods.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; color:#888; padding: 20px;'>Belum ada produk tersimpan.</td></tr>";
                return;
            }

            prods.forEach(p => {
                const totalPhotos = p.images ? p.images.length : 1;
                tbody.innerHTML += `
                    <tr>
                        <td>
                            <div style="position:relative; display:inline-block;">
                                <img src="${p.img}" style="width:40px; height:40px; object-fit:cover; border-radius:4px;">
                                ${totalPhotos > 1 ? `<span style="position:absolute; bottom:-4px; right:-4px; background:#ee4d2d; color:#fff; font-size:9px; padding:1px 4px; border-radius:8px; font-weight:bold;">+${totalPhotos - 1}</span>` : ''}
                            </div>
                        </td>
                        <td><b>${p.name}</b></td>
                        <td>Rp ${p.price.toLocaleString('id-ID')}</td>
                        <td>${p.stock} pcs</td>
                        <td>
                            <button onclick="openProductDetailModal(${p.id})" style="background:#2196f3; color:white; border:none; padding:5px 10px; border-radius:3px; cursor:pointer; font-weight:bold; font-size:11px;">Pratinjau</button>
                            <button onclick="deleteProduct(${p.id})" style="background:#ee4d2d; color:white; border:none; padding:5px 10px; border-radius:3px; cursor:pointer; font-weight:bold; font-size:11px;">Hapus</button>
                        </td>
                    </tr>
                `;
            });
        }

        function openProductDetailModal(id) {
            const product = getProducts().find(p => p.id === id);
            if(!product) return;

            currentActiveImages = product.images && product.images.length > 0 ? product.images : [product.img];
            currentImageIndex = 0;

            document.getElementById('modal-title').innerText = product.name;
            document.getElementById('modal-price').innerText = "Rp " + product.price.toLocaleString('id-ID');

            renderGallery();
            document.getElementById('productDetailModal').style.display = 'flex';
        }

        function renderGallery() {
            document.getElementById('modal-main-img').src = currentActiveImages[currentImageIndex];
            const thumbsContainer = document.getElementById('modal-thumbs-container');
            thumbsContainer.innerHTML = '';

            currentActiveImages.forEach((imgUrl, index) => {
                const thumb = document.createElement('img');
                thumb.src = imgUrl;
                thumb.className = `thumb-img ${index === currentImageIndex ? 'active' : ''}`;
                thumb.onclick = () => {
                    currentImageIndex = index;
                    renderGallery();
                };
                thumbsContainer.appendChild(thumb);
            });
        }

        function navigateGallery(direction) {
            currentImageIndex += direction;
            if (currentImageIndex < 0) currentImageIndex = currentActiveImages.length - 1;
            if (currentImageIndex >= currentActiveImages.length) currentImageIndex = 0;
            renderGallery();
        }

        function closeModal() {
            document.getElementById('productDetailModal').style.display = 'none';
        }

        function deleteProduct(id) {
            if(confirm("Hapus produk ini?")) {
                saveProducts(getProducts().filter(p => p.id !== id));
                renderAdminProductTable();
            }
        }
    </script>
</body>
</html>
