<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Toko Fadli Jaya</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        html, body {
            width: 100vw;
            height: 100dvh;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .portal-card {
            background: #ffffff;
            width: 90%;
            max-width: 420px;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .brand-logo {
            font-size: 28px;
            font-weight: 800;
            color: #b8972e;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .brand-sub {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: #b8972e;
            box-shadow: 0 0 0 3px rgba(184, 151, 46, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: #b8972e;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: #9c7d23;
        }

        .error-text {
            color: #ef4444;
            font-size: 11px;
            margin-top: 10px;
            display: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="portal-card">
        <div class="brand-logo">FADLI JAYA</div>
        <div class="brand-sub">Pilih Mode Akses Sistem Toko</div>

        <form onsubmit="handlePortalLogin(event)">
            <div class="form-group">
                <label>Akses Sebagai</label>
                <select id="role-select" class="form-control" onchange="toggleRoleUI()">
                    <option value="customer">Customer / Pembeli</option>
                    <option value="admin">Admin / Pengelola Toko</option>
                </select>
            </div>

            <div class="form-group" id="password-group" style="display: none;">
                <label>Password Admin</label>
                <input type="password" id="admin-pass" class="form-control" placeholder="Password (admin123)">
            </div>

            <button type="submit" class="btn-submit">Masuk Ke Toko</button>
        </form>
        
        <div id="error-msg" class="error-text">Password Admin Salah!</div>
    </div>

    <script>
        function toggleRoleUI() {
            const role = document.getElementById("role-select").value;
            const passGroup = document.getElementById("password-group");
            if(role === "admin") {
                passGroup.style.display = "block";
            } else {
                passGroup.style.display = "none";
            }
        }

        function handlePortalLogin(e) {
            e.preventDefault();
            const role = document.getElementById("role-select").value;
            const pass = document.getElementById("admin-pass").value;
            const errorMsg = document.getElementById("error-msg");

            if (role === "admin") {
                if (pass === "admin123") {
                    localStorage.setItem('toko_admin_logged', 'true');
                    window.location.href = "admin.html";
                } else {
                    errorMsg.style.display = "block";
                }
            } else {
                window.location.href = "customer.html";
            }
        }
    </script>
</body>
</html>
