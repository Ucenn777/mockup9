<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard - Toko Fadli Jaya</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        html, body {
            width: 100vw;
            height: 100dvh;
            background: #f1f5f9;
            overflow: hidden;
        }

        /* FULL SCREEN LAYOUT CONTAINER */
        .admin-layout {
            display: flex;
            width: 100vw;
            height: 100dvh;
        }

        /* SIDEBAR KIRI */
        .admin-sidebar {
            width: 240px;
            height: 100dvh;
            background: #1e293b;
            color: #fff;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .brand-header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        .brand-header h3 { color: #b8972e; font-size: 16px; letter-spacing: 1px; }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .menu-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 12px 14px;
            text-align: left;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .menu-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .menu-btn.active { background: #b8972e; color: #fff; }

        .btn-exit {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: auto;
        }

        /* AREA KONTEN UTAMA */
        .admin-content {
            flex: 1;
            height: 100dvh;
            padding: 25px;
            overflow-y: auto;
            background: #f8fafc;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }
        .header-bar h2 { font-size: 18px; color: #0f172a; text-transform: uppercase; }

        /* CARDS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #fff;
            padding: 18px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #b8972e;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .stat-card h4 { font-size: 11px; color: #64748b; text-transform: uppercase; margin-bottom: 6px; }
        .stat-card .val { font-size: 20px; font-weight: bold; color: #0f172a; }

        .chart-box {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
        }
        .chart-container { position: relative; height: 260px; width: 100%; }

        /* FORM STYLES */
        .form-box {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            max-width: 600px;
        }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #475569; text-transform: uppercase; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; }

        .btn-primary {
            background: #b8972e; color: white; border: none; padding: 11px 18px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; text-transform: uppercase;
        }

        /* TABLES */
        .table-wrap { width: 100%; overflow-x: auto; background: #fff; border-radius: 10px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        table th, table td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        table th { background: #f1f5f9; color: #475569; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="admin-layout">
        <div class="admin-sidebar">
            <div class="brand-header">
                <h3>FADLI JAYA</h3>
                <span style="font-size: 10px; color: #94a3b8;">Admin Panel</span>
            </div>

            <div class="menu-list">
                <button class="menu-btn active" onclick="switchTab('dashboard', this)">📊 Dashboard</button>
                <button class="menu-btn" onclick="switchTab('input', this)">➕ Input Barang</button>
                <button class="menu-btn" onclick="switchTab('view', this)">📦 Kelola Stok</button>
                <button class="menu-btn" onclick="switchTab('reports', this)">📋 Pesanan Masuk</button>
            </div>

            <button onclick="exitToStore()" class="btn-exit">🛍️ Halaman Customer</button>
        </div>

        <div class="admin-content">
            <div class="header-bar">
                <h2 id="section-title">Dashboard Overview</h2>
            </div>

            <div id="tab-dashboard" class="tab-content">
                <div class="stats-grid">
                    <div class="stat-card">
                        <h4>Total Produk</h4>
                        <div class="val" id="stat-prod">0</div>
                    </div>
                    <div class="stat-card" style="border-left-color: #3b82f6;">
                        <h4>Total Pesanan</h4>
                        <div class="val" id="stat-orders">0</div>
                    </div>
                    <div class="stat-card" style="border-left-color: #10b981;">
                        <h4>Total Pendapatan Toko</h4>
                        <div class="val" id="stat-revenue">Rp 0</div>
                    </div>
                </div>

                <div class="chart-box">
                    <h4 style="font-size: 12px; color: #475569; margin-bottom: 15px; text-transform: uppercase;">📈 GRAFIK TREN PENJUALAN TOKO</h4>
                    <div class="chart-container">
                        <canvas id="salesTrendChart"></canvas>
                    </div>
                </div>
            </div>

            <div id="tab-input" class="tab-content" style="display: none;">
                <div class="form-box">
                    <form id="add-product-form" onsubmit="handleAddNewProduct(event)">
                        <div class="form-group">
                            <label>Nama Barang</label>
                            <input type="text" id="new-name" required placeholder="Contoh: Sepatu Sneakers">
                        </div>
                        <div class="form-group">
                            <label>Harga (Rp)</label>
                            <input type="number" id="new-price" required placeholder="Contoh: 250000">
                        </div>
                        <div class="form-group">
                            <label>Foto Produk</label>
                            <input type="file" id="new-img" accept="image/*" required>
                        </div>
                        <div class="form-group">
                            <label>Varian Warna (Pisahkan dengan koma)</label>
                            <input type="text" id="new-colors" value="Hitam, Cokelat, Navy">
                        </div>
                        <div class="form-group">
                            <label>Stok Awal</label>
                            <input type="number" id="new-stock" value="10" required>
                        </div>
                        <button type="submit" class="btn-primary">Simpan Barang Baru</button>
                    </form>
                </div>
            </div>

            <div id="tab-view" class="tab-content" style="display: none;">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Foto</th>
                                <th>Nama Barang</th>
                                <th>Harga</th>
                                <th>Stok</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="product-table-body"></tbody>
                    </table>
                </div>
            </div>

            <div id="tab-reports" class="tab-content" style="display: none;">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID Order</th>
                                <th>Waktu</th>
                                <th>Pembeli</th>
                                <th>Detail Item</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="sales-table-body"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        let salesChartInstance = null;
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agt', 'Sep', 'Okt', 'Nov', 'Des'];

        window.onload = function() {
            if (!localStorage.getItem('toko_products')) localStorage.setItem('toko_products', JSON.stringify([]));
            updateDashboard();
        };

        function exitToStore() {
            window.location.href = "customer.html";
        }

        function getProducts() { return JSON.parse(localStorage.getItem('toko_products')) || []; }
        function saveProducts(p) { localStorage.setItem('toko_products', JSON.stringify(p)); }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.getElementById('tab-' + tabName).style.display = 'block';

            if(tabName === 'dashboard') updateDashboard();
            if(tabName === 'view') renderProductTable();
            if(tabName === 'reports') renderSalesTable();
        }

        function updateDashboard() {
            const prods = getProducts();
            const sales = JSON.parse(localStorage.getItem('toko_sales')) || [];
            const totalRev = sales.reduce((sum, s) => sum + (s.total || 0), 0);

            document.getElementById("stat-prod").innerText = prods.length;
            document.getElementById("stat-orders").innerText = sales.length;
            document.getElementById("stat-revenue").innerText = "Rp " + totalRev.toLocaleString('id-ID');

            renderSalesChart(sales);
        }

        function renderSalesChart(sales) {
            let monthlyData = new Array(12).fill(0);
            
            sales.forEach(s => {
                let currentMonth = new Date().getMonth();
                monthlyData[currentMonth] += (s.total || 0);
            });

            const ctx = document.getElementById('salesTrendChart').getContext('2d');
            if (salesChartInstance) salesChartInstance.destroy();

            salesChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: months,
                    datasets: [{
                        label: 'Penjualan (Rp)',
                        data: monthlyData,
                        borderColor: '#b8972e',
                        backgroundColor: 'rgba(184, 151, 46, 0.15)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { callback: v => 'Rp ' + (v/1000).toLocaleString('id-ID') + 'k' }
                        }
                    }
                }
            });
        }

        function handleAddNewProduct(e) {
            e.preventDefault();
            const fileInput = document.getElementById("new-img");
            
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    let prods = getProducts();
                    prods.push({
                        id: Date.now(),
                        name: document.getElementById("new-name").value,
                        price: parseInt(document.getElementById("new-price").value),
                        img: evt.target.result,
                        colors: document.getElementById("new-colors").value.split(',').map(c => c.trim()),
                        stock: parseInt(document.getElementById("new-stock").value)
                    });
                    saveProducts(prods);
                    alert("✅ Barang berhasil ditambahkan!");
                    document.getElementById("add-product-form").reset();
                    switchTab('view', document.querySelectorAll('.menu-btn')[2]);
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        function renderProductTable() {
            const tbody = document.getElementById("product-table-body");
            tbody.innerHTML = "";
            let prods = getProducts();

            if(prods.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>Belum ada produk tersimpan.</td></tr>";
                return;
            }

            prods.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${p.img}" style="width:35px; height:35px; object-fit:cover; border-radius:4px;"></td>
                        <td><b>${p.name}</b></td>
                        <td>Rp ${p.price.toLocaleString('id-ID')}</td>
                        <td><input type="number" value="${p.stock}" style="width:60px;" onchange="updateStock(${p.id}, this.value)"> Pcs</td>
                        <td><button onclick="deleteProduct(${p.id})" style="background:#ef4444; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Hapus</button></td>
                    </tr>
                `;
            });
        }

        function updateStock(id, val) {
            let prods = getProducts();
            let p = prods.find(item => item.id === id);
            if(p) { p.stock = parseInt(val) || 0; saveProducts(prods); }
        }

        function deleteProduct(id) {
            if(confirm("Hapus produk ini?")) {
                saveProducts(getProducts().filter(p => p.id !== id));
                renderProductTable();
            }
        }

        function renderSalesTable() {
            const tbody = document.getElementById("sales-table-body");
            tbody.innerHTML = "";
            let sales = JSON.parse(localStorage.getItem('toko_sales')) || [];

            sales.forEach(s => {
                tbody.innerHTML += `
                    <tr>
                        <td><b>#${s.id}</b></td>
                        <td>${s.date}</td>
                        <td>${s.customer}</td>
                        <td>${s.items}</td>
                        <td><b>Rp ${(s.total||0).toLocaleString('id-ID')}</b></td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
