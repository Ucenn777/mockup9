<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login TokoOren</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:white;
padding:30px;
width:350px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#ff5722;
margin-bottom:25px;
}

select,
input{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:#ff5722;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#e64a19;
}

p{
text-align:center;
margin-top:15px;
}

a{
color:#ff5722;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="login-box">

<h1>🛒 TOKOOREN</h1>

<select id="role">
<option value="customer">Customer</option>
<option value="admin">Admin</option>
</select>

<input
type="text"
id="username"
placeholder="Username">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">
Masuk
</button>

<p>
Belum punya akun?
<a href="#">Daftar</a>
</p>

</div>

<script>
function login(){

let role=document.getElementById("role").value;
let username=document.getElementById("username").value.trim();
let password=document.getElementById("password").value.trim();

if(username=="" || password==""){

alert("Username dan Password wajib diisi!");

return;

}

if(role=="admin"){

if(username=="admin" && password=="admin123"){

window.location.href="admin.html";

}else{

alert("Username atau Password Admin salah!");

}

}

if(role=="customer"){

if(username=="customer" && password=="customer123"){

window.location.href="customer.html";

}else{

alert("Username atau Password Customer salah!");

}

}

}
</script>

</body>
</html>
