<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TokoOren - Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.box{
width:350px;
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{
text-align:center;
color:#ff5722;
margin-bottom:20px;
}
select,input,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
}
button{
background:#ff5722;
color:white;
border:none;
cursor:pointer;
}
button:hover{
background:#e64a19;
}
p{
margin-top:15px;
text-align:center;
}
a{
color:#ff5722;
cursor:pointer;
font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h2>🛒 TOKOOREN</h2>

<select id="role">
<option value="customer">Customer</option>
<option value="admin">Admin</option>
</select>

<input type="text" id="user" placeholder="Username">

<input type="password" id="pass" placeholder="Password">

<button onclick="login()">Masuk</button>

<p>Belum punya akun?
<a onclick="daftar()">Daftar</a>
</p>

</div>

<script>

if(localStorage.getItem("adminUser")==null){
localStorage.setItem("adminUser","admin");
localStorage.setItem("adminPass","12345");
}

function daftar(){

let user=prompt("Buat Username");
let pass=prompt("Buat Password");

if(user==null||pass==null||user==""||pass==""){
alert("Username dan Password wajib diisi");
return;
}

localStorage.setItem("customerUser",user);
localStorage.setItem("customerPass",pass);

alert("Akun berhasil dibuat");

}

function login(){

let role=document.getElementById("role").value;
let user=document.getElementById("user").value.trim();
let pass=document.getElementById("pass").value.trim();

if(user==""&&pass==""){
alert("Username dan Password wajib diisi");
return;
}

if(user==""){
alert("Username wajib diisi");
return;
}

if(pass==""){
alert("Password wajib diisi");
return;
}

if(role=="customer"){

if(user==localStorage.getItem("customerUser")&&pass==localStorage.getItem("customerPass")){

location.href="customer.html";

}else{

alert("Username atau Password Customer salah");

}

}else{

if(user=="admin"&&pass=="12345"){

location.href="admin.html";

}else{

alert("Username atau Password Admin salah");

}

}

}

</script>

</body>
</html>
