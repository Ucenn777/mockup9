<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TokoOren - Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#ff6b00,#ff9800);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:90%;
    max-width:420px;
    background:#fff;
    border-radius:20px;
    padding:35px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.logo{
    font-size:40px;
    margin-bottom:10px;
}

h1{
    color:#ff6b00;
    margin-bottom:10px;
}

p{
    color:#666;
    margin-bottom:30px;
}

.btn{
    display:block;
    width:100%;
    padding:15px;
    margin:12px 0;
    border:none;
    border-radius:10px;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

.customer{
    background:#ff6b00;
    color:white;
}

.customer:hover{
    background:#e85d00;
}

.admin{
    background:#222;
    color:white;
}

.admin:hover{
    background:#444;
}

footer{
    margin-top:25px;
    color:#888;
    font-size:13px;
}

@media(max-width:480px){

.container{
padding:25px;
}

h1{
font-size:28px;
}

.btn{
font-size:16px;
}

}
</style>

</head>
<body>

<div class="container">

<div class="logo">🛒</div>

<h1>TokoOren</h1>

<p>Silakan pilih jenis login.</p>

<a href="customer/login.html" class="btn customer">
👤 Login Customer
</a>

<a href="admin/login.html" class="btn admin">
🛠 Login Admin
</a>

<footer>
© 2026 TokoOren<br>
Marketplace Modern
</footer>

</div>

</body>
</html>
