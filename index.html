<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login TokoOren</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
width:350px;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#ff5722;
margin-bottom:20px;
}

select,
input{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:#ff5722;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#e64a19;
}

</style>

</head>

<body>

<div class="login-box">

<h1>🛒 TOKOOREN</h1>

<select id="role">
<option value="">Pilih Login</option>
<option value="admin">Admin</option>
<option value="customer">Customer</option>
</select>

<input
type="text"
id="username"
placeholder="Masukkan Username">

<input
type="password"
id="password"
placeholder="Masukkan Password">

<button onclick="login()">
LOGIN
</button>

</div>

<script>
function login(){

let role=document.getElementById("role").value;
let username=document.getElementById("username").value.trim();
let password=document.getElementById("password").value.trim();

if(role==""){
alert("Silakan pilih Admin atau Customer!");
return;
}

if(username==""){
alert("Username wajib diisi!");
return;
}

if(password==""){
alert("Password wajib diisi!");
return;
}

// Simpan username
localStorage.setItem("username",username);

// Login sesuai role
if(role=="admin"){
window.location.href="admin.html";
}else{
window.location.href="customer.html";
}

}
</script>

</body>
</html>
