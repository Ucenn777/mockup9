<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TokoOren Customer</title>


<style>

*{
box-sizing:border-box;
font-family:Arial, sans-serif;
}


body{
margin:0;
background:#f5f5f5;
}



header{

background:white;
padding:15px;

display:flex;
align-items:center;
justify-content:space-between;

position:sticky;
top:0;

}



.logo{

font-size:22px;
font-weight:bold;
color:#ff5722;

}



.btn{

background:#ff5722;
color:white;

padding:8px 12px;

border-radius:5px;

text-decoration:none;

}



.container{

padding:15px;

}



.product-grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:10px;

}



.product-card{

background:white;

padding:10px;

border-radius:10px;

box-shadow:0 2px 5px #ddd;

}



.product-img{

width:100%;

height:150px;

object-fit:cover;

border-radius:8px;

}



.product-name{

font-weight:bold;

margin-top:8px;

}



.product-price{

color:#ff5722;

font-weight:bold;

}



button{

background:#ff5722;

color:white;

border:0;

padding:10px;

border-radius:5px;

}



</style>


</head>


<body>


<header>


<div class="logo">
TokoOren
</div>


<a href="index.html" class="btn">
Login
</a>


<div class="btn" onclick="bukaKeranjang()">

🛒 <span id="badge">0</span>

</div>


</header>



<div class="container">


<h2>
Produk Terbaru
</h2>


<div id="produk" class="product-grid">


</div>


</div>
<script>


let daftarProduk = 
JSON.parse(localStorage.getItem("produk")) || [];


let keranjang =
JSON.parse(localStorage.getItem("keranjang")) || [];



tampilkanProduk();

updateBadge();



function tampilkanProduk(){


let html="";


if(daftarProduk.length==0){


html=`

<h3 style="text-align:center">
Belum ada produk
</h3>

`;


}else{


daftarProduk.forEach(function(item,index){


html+=`

<div class="product-card"
onclick="detailProduk(${index})">


<img src="${item.gambar}" class="product-img">


<div class="product-name">
${item.nama}
</div>


<div class="product-price">

Rp ${Number(item.harga).toLocaleString('id-ID')}

</div>


</div>


`;


});


}



document.getElementById("produk").innerHTML=html;


}




function detailProduk(index){


let p=daftarProduk[index];


document.getElementById("produk").innerHTML=`

<div class="product-card">


<img src="${p.gambar}" class="product-img">


<h2>
${p.nama}
</h2>


<h3 class="product-price">

Rp ${Number(p.harga).toLocaleString('id-ID')}

</h3>



<p>
${p.deskripsi || "Tidak ada deskripsi"}
</p>



<p>
Pilih Warna:
</p>


<select id="warna">

<option>Hitam</option>

<option>Putih</option>

<option>Merah</option>

<option>Biru</option>

</select>



<br><br>



<p>
Jumlah:
</p>


<input 
id="jumlah"
type="number"
value="1"
min="1">



<br><br>



<button onclick="tambahKeranjang(${index})">

🛒 Tambah Keranjang

</button>



<br><br>



<button onclick="tampilkanProduk()">

⬅ Kembali

</button>



</div>


`;


}




function tambahKeranjang(index){


let p=daftarProduk[index];



keranjang.push({


nama:p.nama,


harga:p.harga,


gambar:p.gambar,


warna:document.getElementById("warna").value,


jumlah:Number(document.getElementById("jumlah").value)



});



localStorage.setItem(

"keranjang",

JSON.stringify(keranjang)

);



updateBadge();



alert("Produk masuk keranjang");


}





function updateBadge(){


document.getElementById("badge").innerHTML=

keranjang.length;


}




function bukaKeranjang(){


/* 
Nanti Part 2:
Halaman keranjang + centang barang + checkout
*/


}
<script>


function tampilKeranjang(){


let html="";


if(keranjang.length==0){


html=`

<h2>
Keranjang kosong
</h2>

<button onclick="tampilkanProduk()">
⬅ Belanja lagi
</button>

`;



}else{



html+=`

<h2>
Keranjang Saya
</h2>

`;



keranjang.forEach(function(item,index){


html+=`

<div class="product-card">


<input 
type="checkbox"
class="pilih"
data-index="${index}"
onchange="hitungTotal()">


<img src="${item.gambar}" 
class="product-img">



<h3>
${item.nama}
</h3>



<p>
Warna : ${item.warna}
</p>



<p class="product-price">

Rp ${Number(item.harga).toLocaleString('id-ID')}

</p>



Jumlah:

<button onclick="kurang(${index})">
-
</button>



${item.jumlah}



<button onclick="tambahJumlah(${index})">
+
</button>



<br><br>


<button onclick="hapus(${index})">
❌ Hapus
</button>


</div>


`;


});



html+=`

<h2>

Total :
Rp <span id="total">
0
</span>

</h2>



<button onclick="checkout()">

Checkout

</button>



<button onclick="tampilkanProduk()">

⬅ Kembali Belanja

</button>


`;



}



document.getElementById("produk").innerHTML=html;



}



function tambahJumlah(index){


keranjang[index].jumlah++;


simpanKeranjang();


tampilKeranjang();


}




function kurang(index){


if(keranjang[index].jumlah>1){

keranjang[index].jumlah--;

}


simpanKeranjang();


tampilKeranjang();


}



function hapus(index){


keranjang.splice(index,1);


simpanKeranjang();


updateBadge();


tampilKeranjang();


}




function simpanKeranjang(){


localStorage.setItem(

"keranjang",

JSON.stringify(keranjang)

);


}





function hitungTotal(){


let total=0;


let pilih=document.querySelectorAll(".pilih");


pilih.forEach(function(check){


if(check.checked){


let index=check.dataset.index;


total += 
Number(keranjang[index].harga) *
keranjang[index].jumlah;


}


});


document.getElementById("total").innerHTML=

total.toLocaleString('id-ID');


}




function checkout(){


let barangDipilih=[];


let pilih=document.querySelectorAll(".pilih");



pilih.forEach(function(check){


if(check.checked){


barangDipilih.push(
keranjang[check.dataset.index]
);


}


});



if(barangDipilih.length==0){


alert("Pilih barang dulu");


return;


}




let pesanan =

JSON.parse(localStorage.getItem("pesanan")) || [];




pesanan.push({


produk:barangDipilih,


tanggal:new Date().toLocaleString(),


status:"Menunggu"


});




localStorage.setItem(

"pesanan",

JSON.stringify(pesanan)

);




alert("Pesanan berhasil dibuat");



}

</script>
<script>


function tampilAkun(){


let pesanan = 
JSON.parse(localStorage.getItem("pesanan")) || [];



let html=`


<h2>
Akun Saya
</h2>



<h3>
Riwayat Pesanan
</h3>


`;



if(pesanan.length==0){


html+=`

<p>
Belum ada pesanan
</p>

`;



}else{



pesanan.forEach(function(item,index){



html+=`

<div class="product-card">


<h3>
Pesanan #${index+1}
</h3>



<p>
Tanggal :
${item.tanggal}
</p>



<p>
Status :
<b>${item.status || "Menunggu"}</b>
</p>



<h4>
Produk:
</h4>


`;



item.produk.forEach(function(p){



html+=`

<p>

${p.nama}

<br>

Warna : ${p.warna}

<br>

Jumlah : ${p.jumlah}

</p>


`;



});



html+=`

</div>


`;



});



}



html+=`

<br>


<button onclick="tampilkanProduk()">

⬅ Kembali Belanja

</button>


`;



document.getElementById("produk").innerHTML=html;



}




</script>
<div class="btn" onclick="tampilAkun()">

👤 Akun

</div>
</body>

</html>
